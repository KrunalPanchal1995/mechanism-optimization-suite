# Free-text note (appears in report header; {fuel_name} is auto-replaced)
study_note: >
  This report documents the p-PRS-based Multi-Stage Optimization (MSO) of the
  chemical kinetic mechanism for {fuel_name}. Stage-1 targets high-temperature
  ignition delay times (HTC); Stage-2 targets low-temperature ignition delay
  times including the negative temperature coefficient (NTC) region.
